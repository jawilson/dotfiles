min_version = "2026.10.8"

# Machine setup for `mise bootstrap`. Platform files (mise.macos.toml, mise.linux.toml,
# mise.windows.toml) load through `auto_env` in .miserc.toml. The profile file
# (mise.work.toml or mise.personal.toml) is selected by .miserc.local.toml,
# which install.sh writes.
[dotfiles]
"~/.bash_aliases" = "bash_aliases"
"~/.bashrc" = "bashrc"
"~/.bin" = "bin"
"~/.chrome-remote-desktop-session" = "chrome-remote-desktop-session"
"~/.cmdrc.bat" = "cmdrc.bat"
"~/.gitconfig" = "gitconfig"
"~/.gitconfig-windows.inc" = "gitconfig-windows.inc"
"~/.gitconfig-work.inc" = "gitconfig-work.inc"
"~/.hammerspoon" = "hammerspoon"
"~/.inputrc" = "inputrc"
"~/.p10k.zsh" = "p10k.zsh"
"~/.screenrc" = "screenrc"
"~/.synergy.conf" = "synergy.conf"
"~/.vim" = "vim"
"~/.vimrc" = "vimrc"
"~/.zshrc" = "zshrc"

# Every entry in these directories links into the matching dot-directory,
# e.g. config/git -> ~/.config/git.
"~/.config/*" = "config/*"
"~/.ssh/*" = "ssh/*"

# Link each custom file while preserving oh-my-zsh's tracked examples.
"~/.oh-my-zsh/custom" = { source = "zsh/custom", mode = "symlink-each" }

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

[bootstrap.user]
login_shell = "/bin/zsh"
