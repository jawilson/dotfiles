min_version = "2026.10.8"

# Machine setup for `mise bootstrap`. Platform files (mise.macos.toml, mise.linux.toml,
# mise.windows.toml) load through `auto_env` in .miserc.toml. The profile file
# (mise.work.toml or mise.personal.toml) is selected by .miserc.local.toml,
# which install.sh writes.
[dotfiles]
"~/.bash_aliases" = "bash_aliases"
"~/.bashrc" = "bashrc"
"~/.bin" = "bin"
"~/.chrome-remote-desktop-session" = "chrome-remote-desktop-session"
"~/.cmdrc.bat" = "cmdrc.bat"
"~/.gitconfig" = "gitconfig"
"~/.gitconfig-windows.inc" = "gitconfig-windows.inc"
"~/.gitconfig-work.inc" = "gitconfig-work.inc"
"~/.hammerspoon" = "hammerspoon"
"~/.inputrc" = "inputrc"
"~/.p10k.zsh" = "p10k.zsh"
"~/.screenrc" = "screenrc"
"~/.synergy.conf" = "synergy.conf"
"~/.vim" = "vim"
"~/.vimrc" = "vimrc"
"~/.zshrc" = "zshrc"

# Every entry in these directories links into the matching dot-directory,
# e.g. config/git -> ~/.config/git.
"~/.config/*" = "config/*"
"~/.ssh/*" = "ssh/*"

# Link each custom file while preserving oh-my-zsh's tracked examples.
"~/.oh-my-zsh/custom" = { source = "zsh/custom", mode = "symlink-each" }

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
# Third-party plugins and themes. Each lives in a real directory under custom/, next to
# the files linked from zsh/custom, and is pinned to a tag or commit; bump the ref to upgrade.
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", ref = "v0.7.1" }
"~/.oh-my-zsh/custom/plugins/zsh-better-npm-completion" = { url = "https://github.com/lukechilds/zsh-better-npm-completion.git", ref = "02ca404a9b585b59788b15af53d4f46fac297153" }
"~/.oh-my-zsh/custom/themes/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git", ref = "35833ea15f14b71dbcebc7e54c104d8d56ca5268" } # v1.20.0; a commit, because status misreads annotated tags

[bootstrap.user]
login_shell = "/bin/zsh"

# age-keygen creates this machine's fnox key in tools/credentials-sync.sh.
[tools]
age = "latest"

[tasks."credentials:sync"]
description = "Cache this profile's credentials from 1Password or Vaultwarden for zsh"
run = "bash tools/credentials-sync.sh"
interactive = true  # Vaultwarden URL, bw login/unlock and op signin prompt on the terminal
