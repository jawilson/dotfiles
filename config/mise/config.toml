# Global mise config, linked to ~/.config/mise by the "~/.config/*" entry in mise.toml.
# fnox is global because zsh runs it at startup from any directory
# (zsh/custom/005-credential-management.zsh).
[tools]
difftastic = "latest"
fnox = "latest"
# node and npm come from mise shims (zshenv, PowerShell profile and cmdrc.bat put the shims dir on PATH).
node = "lts"
